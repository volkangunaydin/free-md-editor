<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free MD Editor</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div id="app">
      <header class="toolbar" id="toolbar">
        <div class="toolbar-group">
          <button class="tb-btn" data-action="new" data-i18n-title="toolbar.new"></button>
          <button class="tb-btn" data-action="open" data-i18n-title="toolbar.open"></button>
          <button class="tb-btn" data-action="save" data-i18n-title="toolbar.save"></button>
          <button class="tb-btn" data-action="save-as" data-i18n-title="toolbar.saveAs"></button>
        </div>

        <div class="toolbar-group mode-switch" role="tablist">
          <button class="mode-btn" data-mode="wysiwyg" role="tab" data-i18n-title="mode.visual.title">
            <span class="mode-icon" data-icon="eye"></span><span data-i18n="mode.visual"></span>
          </button>
          <button class="mode-btn" data-mode="source" role="tab" data-i18n-title="mode.source.title">
            <span class="mode-icon" data-icon="code"></span><span data-i18n="mode.source"></span>
          </button>
        </div>

        <div class="toolbar-group toolbar-right">
          <button class="tb-btn" data-action="theme" data-i18n-title="toolbar.theme"></button>
          <button class="tb-btn" data-action="settings" data-i18n-title="toolbar.settings"></button>
        </div>
      </header>

      <nav class="tabs" id="tabs"></nav>

      <main class="editor-area" id="editor-area">
        <div id="wysiwyg" class="editor-pane pane-wysiwyg"></div>
        <div id="source" class="editor-pane pane-source"></div>
        <div id="empty" class="empty-state hidden">
          <div class="empty-card">
            <h1 data-i18n="app.name"></h1>
            <p data-i18n="empty.subtitle"></p>
            <div class="empty-actions">
              <button class="btn btn-primary" data-action="new"><span data-i18n="empty.new"></span><kbd>Ctrl+N</kbd></button>
              <button class="btn" data-action="open"><span data-i18n="empty.open"></span><kbd>Ctrl+O</kbd></button>
            </div>
            <p class="empty-hint" data-i18n="empty.hint"></p>
          </div>
        </div>
      </main>

      <footer class="statusbar">
        <span id="status-path" class="status-path" title=""></span>
        <span class="status-spacer"></span>
        <span id="status-stats"></span>
        <span id="status-mode"></span>
        <span>UTF-8</span>
      </footer>

      <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-overlay-inner" data-i18n="drop.hint"></div>
      </div>
      <div id="modal-root"></div>
    </div>
  </body>
</html>
