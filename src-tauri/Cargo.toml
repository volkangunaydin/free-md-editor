[package]
name = "free-md-editor"
version = "0.1.0"
description = "Free, open-source Markdown editor for Windows (WYSIWYG + source mode)"
authors = ["Volkan Günaydın"]
license = "MIT"
repository = "https://github.com/volkangunaydin/free-md-editor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "free_md_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
